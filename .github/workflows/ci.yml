name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25.8.0
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Shellcheck hook scripts + install-faithfulness checks (toolchain pins, mcp.json args token)
        run: bash hooks/lint.sh
      - name: Run hook test suites
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          failed=0
          for t in hooks/**/*.test.sh; do
            echo "=== $t ==="
            bash "$t" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more hook test suites failed." >&2
            exit 1
          fi
      - name: Shellcheck mcp-server/boot.sh
        run: shellcheck mcp-server/boot.sh
      - name: Run mcp-server boot unit tests
        run: bash mcp-server/boot.test.sh
      - name: Run mcp-server boot e2e tests
        run: bash mcp-server/boot.e2e.test.sh

  # install-sim: Faithful install-simulation smoke test (backstop for novel leak classes).
  # Uses Node 24.x — deliberately DIFFERENT from the repo-pinned 25.8.0 — to exercise
  # the #361 ambient-node path (.tool-versions pins 25.8.0; wrong Node → shim exit 126).
  # The script itself archives HEAD, spawns the real .mcp.json launcher from a non-repo
  # cwd, and connects via MCP SDK StdioClientTransport.
  #
  # Current status (pre-#356-fix base):
  #   --self-check: PASSES — proves the harness catches the #356 broken form.
  #   normal mode:  EXPECTED TO FAIL — reproduces #356 (${CLAUDE_PLUGIN_ROOT:-.} in args
  #                 is not substituted by bash → launch fails from non-repo cwd).
  #                 The job runs --self-check now; full normal-mode gate activates once
  #                 PR #356 merges (fixing .mcp.json to use a BASH_SOURCE-resolved path).
  #
  # Fidelity gap: node_modules are symlinked from the CI-installed repo copy rather than
  # a real CLAUDE_PLUGIN_DATA install. Does not affect path-resolution testing (#356/#361).
  install-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node 24.x (≠ repo-pinned 25.8.0 — exercises #361 ambient-node path)
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install mcp-server deps (required by boot.sh and the MCP SDK client)
        working-directory: mcp-server
        run: npm ci
      - name: Run install-sim smoke test (self-check — proves harness catches #356)
        # Runs from a non-repo cwd to mirror what a user's project dir would look like.
        # The script itself relocates to a temp archive dir for the actual server spawn.
        # --self-check mode: asserts broken form FAILS, fixed form SUCCEEDS.
        # This mode passes on the current base (pre-#356-fix).
        run: node scripts/install-sim-smoke.mjs --self-check
        working-directory: ${{ github.workspace }}

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x', '25.8.0']
    env:
      HF_TRANSFORMERS_CACHE: ${{ github.workspace }}/.hf-cache
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Cache HuggingFace model (Xenova/all-MiniLM-L6-v2)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-models-${{ runner.os }}-all-MiniLM-L6-v2-v1
          restore-keys: |
            hf-models-${{ runner.os }}-all-MiniLM-L6-v2-
      - run: npm ci
      - name: Audit production dependencies (high+ fails CI)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run lint:deps
      - run: npm run build
      - run: npm test --if-present
