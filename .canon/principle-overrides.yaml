# Canon principle overrides for this repository.
#
# This file configures the principle system for the Canon codebase itself —
# a TypeScript MCP server with no UI, no Terraform, no Docker, no SQL schema.
# Built-in principles that target UI or infrastructure file patterns will never
# match any file in this repository. Rather than deleting them (they are correct
# for other projects), we disable them here using the override mechanism.
#
# Additionally, observable-best-effort is promoted to rule severity and scoped
# to the MCP server source where the 131 catch-block pattern is most prevalent.
#
# Actions:
#   disable         — principle never fires in this repository
#   override-severity — change the enforcement level for this repository only
#   narrow-scope    — restrict the principle to a subset of files

overrides:
  # --- UI-scoped principles (11 unique) ---
  # All target src/components/**, src/ui/**, *.tsx, *.vue, *.svelte, *.css, *.scss
  # patterns that match zero files in this TypeScript MCP server repository.
  # The Svelte UI was deleted (confirmed: workspace delete-mcp-svelte-app-uis).

  - principle_id: compose-from-small-to-large
    action: disable
    reason: "UI-scoped principle (src/components/**, src/ui/**, *.tsx/*.vue/*.svelte); no UI component files in this TypeScript MCP server repository — Svelte app was deleted"

  - principle_id: props-are-the-component-contract
    action: disable
    reason: "UI-scoped principle (src/components/**, src/ui/**, *.tsx/*.vue/*.svelte); no component files exist in this repository"

  - principle_id: unidirectional-data-flow
    action: disable
    reason: "UI-scoped principle (src/components/**, src/ui/**, *.tsx/*.vue/*.svelte); no UI files in this repository"

  - principle_id: deploy-frontend-modules-independently
    action: disable
    reason: "UI/infra-scoped principle for micro-frontend deployments (src/**, packages/**, apps/**); this repository has no frontend modules to deploy independently"

  - principle_id: minimize-client-side-state
    action: disable
    reason: "UI-scoped principle (src/**, *.tsx/*.vue/*.svelte); no client-side state management in this server-side TypeScript MCP server"

  - principle_id: isolate-frontend-runtime-state
    action: disable
    reason: "UI-scoped principle for micro-frontend module isolation (src/**, packages/**, apps/**); no frontend runtime exists in this repository"

  - principle_id: resilient-frontend-composition
    action: disable
    reason: "UI-scoped principle for frontend module error boundaries (src/**, packages/**, apps/**); no frontend composition in this repository"

  - principle_id: single-source-of-component-styles
    action: disable
    reason: "UI/style-scoped principle (*.css, *.scss, *.tsx/*.vue); no CSS, SCSS, or styled component files exist in this repository"

  - principle_id: design-tokens-as-style-contract
    action: disable
    reason: "UI/style-scoped principle (*.css, *.scss, *.tsx/*.vue); no design tokens or style files exist in this repository"

  - principle_id: colocate-component-assets
    action: disable
    reason: "UI-scoped principle for component file co-location (src/components/**, src/ui/**); no UI components exist in this repository"

  - principle_id: prefer-browser-native-integration
    action: disable
    reason: "UI-scoped principle for browser API usage in micro-frontends (src/**, packages/**, apps/**); no browser runtime in this server-side repository"

  # --- Infrastructure-scoped principles (5) ---
  # All target *.tf, *.tfvars, **/terraform/**, Dockerfile, **/k8s/**, etc.
  # This repository has no Terraform, no Kubernetes manifests, no Dockerfiles.

  - principle_id: immutable-infrastructure
    action: disable
    reason: "Infra-scoped principle (*.tf, *.tfvars, **/terraform/**, Dockerfile, k8s/**); no infrastructure-as-code files exist in this repository"

  - principle_id: least-privilege-access
    action: disable
    reason: "Infra-scoped principle (*.tf, *.tfvars, **/terraform/**, Dockerfile, k8s/**, helm/**); no IAM or infra config files in this repository — the rule-level security constraint is handled by secrets-never-in-code for this codebase"

  - principle_id: design-for-self-healing
    action: disable
    reason: "Infra-scoped principle for orchestration/restart policies (*.tf, Dockerfile, k8s/**); no infrastructure definitions in this repository"

  - principle_id: infrastructure-tested-like-code
    action: disable
    reason: "Infra-scoped principle for testing Terraform/k8s definitions (*.tf, Dockerfile, k8s/**); no infrastructure definitions exist to test in this repository"

  - principle_id: architectural-fitness-functions
    action: disable
    reason: "Infra-scoped principle (scope.layers: [infra]); despite matching **/__tests__/** file patterns, the infra layer gate prevents it from firing on mcp-server test files — disabling to make this structural non-applicability explicit"

  # --- observable-best-effort: promote to rule + narrow to MCP server ---
  # Evidence: 131 catch blocks in mcp-server/src/; canonical transcript-capture
  # failure story (principle fixed 3 times, never worked due to silent catches);
  # treated as blocking-level in practice. Keeping file in strong-opinions/ and
  # using overrides to promote severity and add explicit scope.

  - principle_id: observable-best-effort
    action: override-severity
    severity: rule
    reason: "131 catch blocks in mcp-server/src/ with ~20% genuinely silent; canonical silent-failure story documented in principle body (transcript-capture fixed 3 times, never worked); reviewers already treat violations as blocking — promoting to rule makes enforcement consistent with practice"

  - principle_id: observable-best-effort
    action: narrow-scope
    applies_to:
      layers: []
      file_patterns:
        - "mcp-server/src/**"
    reason: "Scope observable-best-effort explicitly to the MCP server production code where the 131 catch-block pattern is most prevalent; the principle body's examples and rationale are all drawn from mcp-server/src/ findings"
