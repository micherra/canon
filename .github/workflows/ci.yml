name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Shellcheck hook scripts
        run: bash hooks/lint.sh
      - name: Run hook test suites
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          failed=0
          for t in hooks/**/*.test.sh; do
            echo "=== $t ==="
            bash "$t" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more hook test suites failed." >&2
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25.8.0
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:deps
      - run: npm run build
      - run: npm test --if-present
