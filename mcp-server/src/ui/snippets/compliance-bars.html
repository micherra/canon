<!--
  @snippet compliance-bars
  @description Three horizontal progress bars showing compliance scores for rules, opinions, and conventions. Includes honored principle badges.
  @data { rules: { passed: number, total: number }, opinions: { passed: number, total: number }, conventions: { passed: number, total: number }, honored?: string[] }
  @tokens --bg-card, --border, --text, --text-muted, --success
  @usage Place as a card in a dashboard grid. Compute bar width as (passed/total * 100)%.
    Bar color: green (var(--success)) when passed === total, otherwise use severity color.
    Severity colors: rule="#e74c3c", strong-opinion="#f39c12", convention="#3498db".
    Honored badges render as small green pills below the bars.
    Replace {{RULES_PASSED}}/{{RULES_TOTAL}}, {{OPINIONS_PASSED}}/{{OPINIONS_TOTAL}}, {{CONVENTIONS_PASSED}}/{{CONVENTIONS_TOTAL}}, {{RULES_WIDTH}}, etc.
-->
<div class="compliance-score">
  <div class="section-title">Compliance Score</div>
  <div class="bars">
    <div class="bar-row">
      <span class="bar-label">Rules</span>
      <span class="bar-count">{{RULES_PASSED}}/{{RULES_TOTAL}}</span>
      <div class="bar-track"><div class="bar-fill" style="width: {{RULES_WIDTH}}%; background: {{RULES_COLOR}}"></div></div>
    </div>
    <div class="bar-row">
      <span class="bar-label">Opinions</span>
      <span class="bar-count">{{OPINIONS_PASSED}}/{{OPINIONS_TOTAL}}</span>
      <div class="bar-track"><div class="bar-fill" style="width: {{OPINIONS_WIDTH}}%; background: {{OPINIONS_COLOR}}"></div></div>
    </div>
    <div class="bar-row">
      <span class="bar-label">Conventions</span>
      <span class="bar-count">{{CONVENTIONS_PASSED}}/{{CONVENTIONS_TOTAL}}</span>
      <div class="bar-track"><div class="bar-fill" style="width: {{CONVENTIONS_WIDTH}}%; background: {{CONVENTIONS_COLOR}}"></div></div>
    </div>
  </div>
</div>
<style>
  .compliance-score {
    padding: 12px 16px;
    background: var(--bg-card, rgba(255, 255, 255, 0.04));
    border-radius: 6px;
    border: 1px solid var(--border, rgba(255, 255, 255, 0.06));
  }
  .section-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-muted, #888);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .bar-label { width: 80px; flex-shrink: 0; color: var(--text, #e0e0e0); }
  .bar-count { width: 36px; flex-shrink: 0; color: var(--text-muted, #888); font-size: 15px; text-align: right; }
  .bar-track { flex: 1; height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
</style>
