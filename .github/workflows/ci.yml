name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25.8.0
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Shellcheck hook scripts
        run: bash hooks/lint.sh
      - name: Run hook test suites
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          failed=0
          for t in hooks/**/*.test.sh; do
            echo "=== $t ==="
            bash "$t" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more hook test suites failed." >&2
            exit 1
          fi
      - name: Shellcheck mcp-server/boot.sh
        run: shellcheck mcp-server/boot.sh
      - name: Run mcp-server boot unit tests
        run: bash mcp-server/boot.test.sh
      - name: Run mcp-server boot e2e tests
        run: bash mcp-server/boot.e2e.test.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x', '25.8.0']
    env:
      HF_TRANSFORMERS_CACHE: ${{ github.workspace }}/.hf-cache
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Cache HuggingFace model (Xenova/all-MiniLM-L6-v2)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-models-${{ runner.os }}-all-MiniLM-L6-v2-v1
          restore-keys: |
            hf-models-${{ runner.os }}-all-MiniLM-L6-v2-
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:deps
      - run: npm run build
      - run: npm test --if-present
