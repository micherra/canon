name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Install mcp-server dependencies (typescript for dead-wire-gate helper)
        working-directory: mcp-server
        run: npm ci
      - name: Shellcheck hook scripts + install-faithfulness checks (toolchain pins, mcp.json args token)
        run: bash hooks/lint.sh
      - name: Run hook + agent + skill test suites
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          failed=0
          for t in hooks/**/*.test.sh agents/**/*.test.sh skills/**/*.test.sh; do
            echo "=== $t ==="
            bash "$t" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more hook/agent/skill test suites failed." >&2
            exit 1
          fi
      - name: Shellcheck mcp-server/boot.sh
        run: shellcheck mcp-server/boot.sh
      - name: Run mcp-server boot unit tests
        run: bash mcp-server/boot.test.sh
      - name: Run mcp-server boot e2e tests
        run: bash mcp-server/boot.e2e.test.sh
      - name: Run .mcp.json boot-resolver tests (var-absent regression guard)
        run: bash mcp-server/mcp-json-resolver.test.sh

  # install-sim: Faithful install-simulation smoke test (backstop for novel leak classes).
  # Uses Node 24.x — deliberately DIFFERENT from the repo-pinned 26.4.0 — to exercise
  # the #361 ambient-node path (repo pins 26.4.0 in CI + REPO_PINNED_NODE_VERSION; wrong Node → shim exit 126).
  # The script detects the HTTP form of .mcp.json: it archives HEAD, boots boot.sh
  # --daemon on a throwaway test port with a throwaway token from a non-repo cwd,
  # resolves the headersHelper, and connects via MCP SDK StreamableHTTPClientTransport.
  #
  # Status (HTTP transport, activated post-#356/#370):
  #   --self-check: PASSES — proves the harness catches the unresolved-headersHelper
  #                 broken form (HTTP analog of the #356 broken form).
  #   normal mode:  ACTIVE GATE — exercises the full HTTP launch path: archives HEAD,
  #                 symlinks node_modules, boots the daemon, resolves headersHelper,
  #                 and asserts initialize + non-empty listTools succeeds.
  #
  # Fidelity gap: node_modules are symlinked from the CI-installed repo copy rather than
  # a real CLAUDE_PLUGIN_DATA install. Does not affect path-resolution testing (#356/#361).
  install-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 24.x (≠ repo-pinned 26.4.0 — exercises #361 ambient-node path)
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install mcp-server deps (required by boot.sh and the MCP SDK client)
        working-directory: mcp-server
        run: npm ci
      - name: Run install-sim smoke test (self-check + full normal-mode gate)
        run: |
          node scripts/install-sim-smoke.mjs --self-check
          node scripts/install-sim-smoke.mjs
        working-directory: ${{ github.workspace }}

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x', '26.4.0']
    env:
      HF_TRANSFORMERS_CACHE: ${{ github.workspace }}/.hf-cache
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Cache HuggingFace model (Xenova/all-MiniLM-L6-v2)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-models-${{ runner.os }}-all-MiniLM-L6-v2-v1
          restore-keys: |
            hf-models-${{ runner.os }}-all-MiniLM-L6-v2-
      - run: npm ci
      - name: Audit production dependencies (high+ fails CI)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run lint:deps
      - run: npm run build
      - name: Run plugin-dir resolver tests (var-absent / literal-token regression guard)
        run: bash plugin-dir-resolver.test.sh
      - run: npm test --if-present
