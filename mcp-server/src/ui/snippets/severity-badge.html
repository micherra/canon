<!--
  @snippet severity-badge
  @description Inline badge showing a severity level with appropriate coloring. Used in violation lists and principle groupings.
  @data { severity: "rule"|"strong-opinion"|"convention", label?: string }
  @tokens (none -- colors are hardcoded per severity)
  @usage Inline in a flex row alongside principle ID and file count.
    Colors: rule="#e74c3c", strong-opinion="#f39c12", convention="#3498db".
    Replace {{SEVERITY_COLOR}} with the hex color, {{SEVERITY_LABEL}} with display text (e.g., "rule", "opinion", "convention").
-->
<span class="severity-badge" style="background: {{SEVERITY_COLOR}}22; color: {{SEVERITY_COLOR}}; border-color: {{SEVERITY_COLOR}}44;">
  {{SEVERITY_LABEL}}
</span>
<style>
  .severity-badge {
    font-size: 13px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid transparent;
    white-space: nowrap;
    letter-spacing: 0.03em;
  }
</style>
