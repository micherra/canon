<!--
  @snippet bar-chart-row
  @description A single row for a horizontal bar chart: label, proportional bar, and value. Used for blast radius, layer distribution, etc.
  @data { label: string, value: number, maxValue: number, barColor?: string }
  @tokens --bg-card, --border, --text, --text-muted, --accent
  @usage Stack multiple rows in a flex-column container. Compute bar width as percentage: (value / maxValue * 100)%.
    Default bar color is var(--accent). Override with barColor for per-item coloring (e.g., layer colors).
    Replace {{LABEL}}, {{WIDTH_PERCENT}}, {{VALUE}}, and optionally {{BAR_COLOR}}.
-->
<div class="chart-row">
  <span class="chart-label">{{LABEL}}</span>
  <div class="bar-track">
    <div class="bar-fill" style="width: {{WIDTH_PERCENT}}%; background: {{BAR_COLOR}}"></div>
  </div>
  <span class="chart-value">{{VALUE}}</span>
</div>
<style>
  .chart-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
  }
  .chart-label {
    width: 140px;
    flex-shrink: 0;
    color: var(--text, #e0e0e0);
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    flex: 1;
    height: 8px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
  }
  .chart-value {
    width: 28px;
    flex-shrink: 0;
    color: var(--text-muted, #888);
    text-align: right;
    font-size: 13px;
  }
</style>
